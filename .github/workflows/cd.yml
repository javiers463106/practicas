name: CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        shell: bash
        run: |
          VERSION=$(grep -oE 'AppVersion-[0-9]+' README.md | head -1 | cut -d'-' -f2)
          NEW_VERSION=$((VERSION + 1))
          DATE=$(date '+%Y-%m-%d %H:%M:%S')

          sed -i -E "s/AppVersion-[0-9]+.*/AppVersion-${NEW_VERSION} ${DATE}/" README.md

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md
          git commit -m "Bump README version to AppVersion-${NEW_VERSION}" || echo "No changes to commit"
          git push

  validate-production:
    needs: bump-version
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production token
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        shell: powershell
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Los tokens de producción coinciden"
          } else {
            Write-Host "Los tokens de producción NO coinciden"
            exit 1
          }
