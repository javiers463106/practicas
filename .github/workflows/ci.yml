name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  update-readme:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        shell: powershell
        run: |
          Add-Content README.md "Nueva feature añadida"

  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DEV token
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        shell: powershell
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Los tokens coinciden"
          } else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }
